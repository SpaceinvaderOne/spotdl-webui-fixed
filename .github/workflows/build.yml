name: build-and-publish

# Why this exists: the reason downloads broke in the first place was a yt-dlp
# that was three months old, not anything spotdl-specific. Any hand-built image
# rots the same way, so the image is rebuilt on a schedule against whatever
# yt-dlp PyPI is serving that day. The patch anchors double as a tripwire -
# when upstream rewrites the web UI, this workflow fails instead of quietly
# publishing an image that rolled their fixes back.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC (odd minute: fewer runner pile-ups)
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and re-push even if the tag already exists"
        type: boolean
        default: false
  push:
    paths:
      - "Dockerfile"
      - "patches/**"
      - "launcher/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write
  issues: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # -> ghcr.io/<owner>/<repo>
  BASE_REPO: spotdl/spotify-downloader

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      skipped: ${{ steps.decide.outputs.skipped }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v3 # for the linux/arm64 half of the build

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve current upstream versions
        id: versions
        run: |
          set -euo pipefail

          ytdlp=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)

          # Digest, not tag: the patch is anchored to exact upstream source.
          base=$(docker buildx imagetools inspect "${BASE_REPO}:latest" \
                   --format '{{.Manifest.Digest}}')
          base="${base#sha256:}"

          spotdl=$(docker run --rm --entrypoint /app/.venv/bin/spotdl \
                     "${BASE_REPO}@sha256:${base}" --version | tr -dc '0-9.')

          # ghcr.io rejects uppercase in image names and GitHub logins are
          # commonly CamelCase, so normalise the repository name once, here.
          image=$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          # PyPI reports 2026.8.19 while `yt-dlp --version` prints the PEP440
          # normalisation 2026.08.19. Comparing those as strings always fails.
          ytdlp_norm=$(printf '%s' "$ytdlp" | awk -F. -v OFS=. '{
            for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+$/) $i = sprintf("%02d", $i)
          }1')

          # Our own revision, from the patch script: 4.5.2-r2 -> r2. Without it,
          # two builds of the same yt-dlp/spotdl pair would publish under the
          # same tag name, so a host that pins anything other than :latest
          # cannot tell which build it actually got.
          rev=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' patches/patch_webui.py | head -1)
          case "$rev" in
            *-*) rev="${rev##*-}" ;;
            *)   rev="r0" ;;
          esac

          echo "ytdlp=${ytdlp}"            | tee -a "$GITHUB_OUTPUT"
          echo "ytdlp_norm=${ytdlp_norm}"  | tee -a "$GITHUB_OUTPUT"
          echo "image=${image}"            | tee -a "$GITHUB_OUTPUT"
          echo "base_sha=${base}"          | tee -a "$GITHUB_OUTPUT"
          echo "spotdl=${spotdl}"          | tee -a "$GITHUB_OUTPUT"
          echo "rev=${rev}"                | tee -a "$GITHUB_OUTPUT"
          # ytdlp_norm, not ytdlp: PyPI reports 2026.8.19, the README and every
          # human writing a tag by hand write 2026.08.19, and the padded form
          # sorts correctly. The published image was labelled 2026.8.19 while
          # the README documented 2026.08.19, so one of them had to change.
          echo "tag=${ytdlp_norm}-spotdl${spotdl}-${rev}" | tee -a "$GITHUB_OUTPUT"

      - name: Decide whether a build is needed
        id: decide
        env:
          TAG: ${{ steps.versions.outputs.tag }}
          IMAGE: ${{ steps.versions.outputs.image }}
          FORCE: ${{ github.event.inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Only the daily cron may skip. A push or a manual run means somebody
          # changed the Dockerfile, the patch or this workflow - and the yt-dlp /
          # spotdl version pair is unchanged in exactly that case, so skipping on
          # tag existence alone would refuse to build precisely those changes.
          if [ "$EVENT" != "schedule" ] || [ "$FORCE" = "true" ]; then
            echo "building (event=$EVENT force=$FORCE)"
          elif docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${TAG}" \
                 >/dev/null 2>&1; then
            echo "already published ${TAG}, nothing to do"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          fi

      # Single-arch and --load so it can actually be run here.
      - name: Build smoke image
        if: steps.decide.outputs.skipped != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: spotdl-smoke:latest
          build-args: |
            BASE_IMAGE=${{ env.BASE_REPO }}@sha256:${{ steps.versions.outputs.base_sha }}
            YT_DLP_SPEC=yt-dlp[default]==${{ steps.versions.outputs.ytdlp }}
            IMAGE_VERSION=${{ steps.versions.outputs.tag }}
            BASE_DIGEST=${{ steps.versions.outputs.base_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: steps.decide.outputs.skipped != 'true'
        run: |
          set -uo pipefail

          # Print the container's own output on any failure. Without this the
          # only evidence left in the log is "exit code 1", which sends you
          # guessing at which of these six checks broke.
          fail() {
            echo "::error::$1"
            echo "--- docker logs smoke ---"
            docker logs smoke 2>&1 | tail -40
            exit 1
          }

          # The patch must actually be in the shipped modules.
          docker run --rm --entrypoint grep spotdl-smoke:latest \
            -q "def resolve_songs" /app/spotdl/web/routes.py \
            || fail "web/routes.py is not patched"
          docker run --rm --entrypoint grep spotdl-smoke:latest \
            -q "download_song_with_retry" /app/spotdl/web/api.py \
            || fail "web/api.py is not patched"
          docker run --rm --entrypoint grep spotdl-smoke:latest \
            -q "None, get_search_results" /app/spotdl/web/routes.py \
            || fail "search handler is not patched (UI would still freeze)"
          # The one that fails silently: a url paste resolves and downloads
          # nothing, with no error in the log.
          docker run --rm --entrypoint grep spotdl-smoke:latest \
            -q "create_task(_drain" /app/spotdl/web/routes.py \
            || fail "url download is still tied to its request (paste a url and it does nothing)"

          # The CLI must work from a plain shell, at the version we built from.
          docker run --rm --entrypoint sh spotdl-smoke:latest -c \
            'command -v spotdl >/dev/null && spotdl --version' \
            || fail "spotdl is not runnable via /usr/local/bin/spotdl"

          want="${{ steps.versions.outputs.ytdlp_norm }}"
          got=$(docker run --rm --entrypoint /app/.venv/bin/yt-dlp spotdl-smoke:latest --version) \
            || fail "yt-dlp would not run"
          # numeric compare: newest of the two, first, must be the expectation
          oldest=$(printf '%s\n%s\n' "$want" "$got" | sort -V | head -1)
          [ "$oldest" = "$want" ] || fail "yt-dlp $got is older than $want"
          echo "yt-dlp $got (expected >= $want)"

          # The web server must boot and answer. Downloads are deliberately NOT
          # tested here: GitHub's datacenter IPs are bot-blocked by YouTube, so a
          # real download from CI would be red 99% of the time and tell us
          # nothing. 127.0.0.1, not localhost - the runner prefers IPv6 and the
          # container only binds v4.
          docker run -d --name smoke -p 8800:8800 spotdl-smoke:latest \
            web --host 0.0.0.0 --web-use-output-dir >/dev/null

          ready=""
          for _ in $(seq 1 60); do
            if curl -fsS -m 5 http://127.0.0.1:8800/api/version >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          [ -n "$ready" ] || fail "web server never answered on :8800 after 120s"

          echo "api/version: $(curl -fsS http://127.0.0.1:8800/api/version)"
          echo "web UI: http $(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8800/)"
          docker logs smoke 2>&1 | tail -12
          docker stop smoke >/dev/null

      - name: Publish multi-arch image
        if: steps.decide.outputs.skipped != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ env.BASE_REPO }}@sha256:${{ steps.versions.outputs.base_sha }}
            YT_DLP_SPEC=yt-dlp[default]==${{ steps.versions.outputs.ytdlp }}
            IMAGE_VERSION=${{ steps.versions.outputs.tag }}
            BASE_DIGEST=${{ steps.versions.outputs.base_sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.versions.outputs.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.versions.outputs.image }}:spotdl${{ steps.versions.outputs.spotdl }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The patch failing is the interesting failure: it means upstream moved
      # and the anchors need re-deriving. Make sure a human sees that.
      - name: Open an issue if the patch drifted
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          set -euo pipefail
          title="Automated build failed: patch anchors drifted (yt-dlp ${TAG})"
          if gh issue list --state open --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "issue already open, leaving it alone"
            exit 0
          fi
          gh issue create --title "$title" --body "The scheduled build could not apply \`patches/patch_webui.py\`. Upstream spotdl has changed the web UI modules; re-derive the patch with \`dev/gen_patch.py\` (see dev/README.md).

          Job: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
